name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Bundle world map data
        run: |
          mkdir -p public
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/world.geojson \
            --output public/world.geojson
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v6
        with:
          name: si053-web-build
          path: dist
          retention-days: 7
