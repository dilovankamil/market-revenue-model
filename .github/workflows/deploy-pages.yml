name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SHOW_PRIVATE_MODULES: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Bundle world map data
        run: |
          mkdir -p public
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/world.geojson \
            --output public/world.geojson
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for automatic branch Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Giving GitHub's automatic branch/Jekyll Pages run time to register..."
          sleep 60
          echo "Checking for the competing Pages run for ${GITHUB_SHA}..."

          legacy_status="missing"
          for attempt in $(seq 1 30); do
            legacy_status="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100" \
              --jq '[.workflow_runs[] | select(.name == "pages build and deployment")][0].status // "missing"')"
            if [ "${legacy_status}" != "missing" ]; then
              break
            fi
            sleep 2
          done

          if [ "${legacy_status}" = "missing" ]; then
            echo "No competing automatic Pages run found; publishing immediately."
            exit 0
          fi

          echo "Competing automatic Pages run detected. Waiting until it completes so the Vite artifact is published last."
          for attempt in $(seq 1 90); do
            legacy_status="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100" \
              --jq '[.workflow_runs[] | select(.name == "pages build and deployment")][0].status // "missing"')"
            if [ "${legacy_status}" = "completed" ]; then
              echo "Automatic Pages run completed. Safe to publish Vite build."
              exit 0
            fi
            sleep 2
          done

          echo "Automatic Pages run did not complete within the guard window."
          exit 1

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
