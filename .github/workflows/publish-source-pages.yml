name: Publish Pages release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-pages-release
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Bundle world map data
        run: |
          mkdir -p public
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/world.geojson \
            --output public/world.geojson
      - run: npm ci
      - run: npm test
      - run: npm run release:pages
      - name: Commit the browser-ready release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app.js assets/style.css public/world.geojson
          if git diff --cached --quiet; then
            echo "Release aliases already match the current source."
            exit 0
          fi
          git commit -m "Publish compiled Pages release for ${GITHUB_SHA::7}"
          git push origin HEAD:main
